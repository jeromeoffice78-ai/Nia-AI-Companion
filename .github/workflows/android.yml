name: Build Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Require approved Nia rig and replace prototype
        run: |
          test -s assets/nia-appearance-facial-rig-v2.glb || { echo "::error::Approved skeletal rig is missing from assets/"; exit 1; }
          python3 scripts/verify_nia_rig.py assets/nia-appearance-facial-rig-v2.glb
          cp assets/nia-appearance-facial-rig-v2.glb assets/nia-character-animated.glb
      - name: Verify active bundled GLB
        run: python3 scripts/verify_nia_rig.py assets/nia-character-animated.glb
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate project
        run: npm test
      - name: Align Expo dependency versions
        run: CI=1 npx expo install --fix
      - name: Recheck tests after Expo dependency alignment
        run: npm test
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
