name: Build Android Standalone Test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate project
        run: |
          set -o pipefail
          npm test 2>&1 | tee nia-test.log
      - name: Align Expo dependency versions
        run: CI=1 npx expo install --check
      - name: Recheck tests after Expo dependency alignment
        run: npm test
      - name: Check TypeScript
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee nia-typescript.log
      - name: Require approved Nia rig and replace prototype
        run: |
          test -s assets/nia-appearance-facial-rig-v2.glb || { echo "::error::Approved skeletal rig is missing from assets/"; exit 1; }
          python3 scripts/verify_nia_rig.py assets/nia-appearance-facial-rig-v2.glb
          cp assets/nia-appearance-facial-rig-v2.glb assets/nia-character-animated.glb
      - name: Verify active bundled GLB
        run: python3 scripts/verify_nia_rig.py assets/nia-character-animated.glb
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build standalone test APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify embedded application bundle
        run: unzip -l android/app/build/outputs/apk/release/app-release.apk | grep 'assets/index.android.bundle'
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nia-standalone-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nia-validation-logs
          path: |
            nia-test.log
            nia-typescript.log
          if-no-files-found: ignore

