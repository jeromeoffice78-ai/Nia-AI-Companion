name: Build Android Standalone Test APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: nia-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Pull requests restore caches, but only main publishes shared entries.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate project
        run: |
          set -o pipefail
          npm test 2>&1 | tee nia-test.log
      - name: Align Expo dependency versions
        run: CI=1 npx expo install --check
      - name: Recheck tests after Expo dependency alignment
        run: npm test
      - name: Check TypeScript
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee nia-typescript.log
      - name: Validate active Nia rig without silently replacing it
        run: |
          test -s assets/nia-character-animated.glb || { echo "::error::Animated Nia test asset missing"; exit 1; }
          python3 scripts/verify_nia_rig.py assets/nia-character-animated.glb
      - name: Verify active bundled GLB
        run: python3 scripts/verify_nia_rig.py assets/nia-character-animated.glb
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build standalone test APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Verify embedded application bundle
        run: unzip -l android/app/build/outputs/apk/release/app-release.apk | grep 'assets/index.android.bundle'
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nia-standalone-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nia-validation-logs
          path: |
            nia-test.log
            nia-typescript.log
          if-no-files-found: ignore

  emulator-smoke:
    name: Install, launch and verify 3D avatar on Android emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nia-standalone-test-apk
          path: nia-build
      - name: Enable KVM for hardware-accelerated Android emulator
        run: |
          sudo chown "$USER" /dev/kvm
      - name: Install APK, verify Android scene and background/resume
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-emulator-smoke.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nia-emulator-smoke-diagnostics
          path: artifacts/android-smoke/
          if-no-files-found: ignore
