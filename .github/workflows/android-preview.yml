name: Nia Android Release Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || { echo 'Android SDK not found on runner'; exit 1; }
          java -version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Align Expo packages
        run: CI=1 npx expo install --fix
      - name: Type check
        run: npx tsc --noEmit
      - name: Require completed production avatar rig
        run: |
          test -s assets/nia-appearance-facial-rig-v2.glb || { echo '::error::Approved animated avatar missing; refusing incomplete APK'; exit 1; }
          python3 scripts/verify_nia_rig.py assets/nia-appearance-facial-rig-v2.glb
          cp assets/nia-appearance-facial-rig-v2.glb assets/nia-character-animated.glb
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build preview APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nia-build-diagnostics
          path: |
            android/app/build/reports/
            android/build/reports/
            npm-debug.log
          if-no-files-found: ignore
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: nia-verified-rig-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
