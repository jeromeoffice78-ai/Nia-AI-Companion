name: Build Nia Android Preview APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Verify prototype model exists
        run: test -s assets/nia-character-animated.glb
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Align Expo packages
        run: CI=1 npx expo install --fix
      - name: Type check
        run: npx tsc --noEmit
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build preview APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: nia-groq-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
